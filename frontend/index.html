<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/icons/flexivor-icon.svg" />
    <link rel="apple-touch-icon" href="/icons/flexivor-icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Catálogo Oficial Truper · Flexivor</title>
    <meta name="description" content="Catálogo digital interactivo oficial de productos Truper y submarcas. Consulta precios públicos y comparte cotizaciones por WhatsApp en el ecosistema Flexivor." />
    
    <!-- OpenGraph Tags -->
    <meta property="og:title" content="Catálogo Oficial Truper · Flexivor" />
    <meta property="og:description" content="Consulta más de 16,000 productos oficiales Truper con fotos y precios públicos con IVA. Comparte por WhatsApp al instante." />
    <meta property="og:image" content="/icons/flexivor-og-preview.png" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0b2f68" />

    <style>
      /* Fallback Instant Startup Splash (Zero-Latency) */
      .startup-splash-fb {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(135deg, #061733 0%, #0b2f68 50%, #1456b8 100%);
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      .startup-card-fb {
        width: min(340px, 90vw);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .startup-logo-fb {
        width: 140px;
        max-height: 60px;
        object-fit: contain;
        margin-bottom: 16px;
        filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        animation: fbPulse 1.8s ease-in-out infinite;
      }
      .startup-brand-fb {
        font-size: 1.6rem;
        font-weight: 900;
        letter-spacing: -0.02em;
        margin-bottom: 4px;
      }
      .startup-sub-fb {
        font-size: 0.75rem;
        color: #bae6fd;
        font-weight: 600;
        margin-bottom: 20px;
      }
      .startup-bar-fb {
        width: min(260px, 80vw);
        height: 8px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 999px;
        overflow: hidden;
      }
      .startup-fill-fb {
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, #f07d00, #38bdf8);
        border-radius: 999px;
        animation: fbProgress 1.5s ease-in-out infinite alternate;
      }
      .startup-msg-fb {
        margin-top: 14px;
        font-size: 0.82rem;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.85);
      }
      @keyframes fbPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
      @keyframes fbProgress {
        0% { width: 15%; }
        100% { width: 85%; }
      }
    </style>
  </head>
  <body class="bg-[#f3f6f8] text-[#142230] antialiased selection:bg-[#f07d00] selection:text-white">
    <div id="root">
      <!-- Fallback Instant Splash Screen -->
      <div id="startupSplashFallback" class="startup-splash-fb">
        <div class="startup-card-fb">
          <img class="startup-logo-fb" src="/icons/logo-flexivor-web.png" alt="Flexivor" onerror="this.src='/icons/flexivor-icon.svg'">
          <div class="startup-brand-fb">TRUPER<span style="color:#f07d00">.</span></div>
          <div class="startup-sub-fb">Catálogo Oficial · Ecosistema Flexivor</div>
          <div class="startup-bar-fb">
            <div class="startup-fill-fb"></div>
          </div>
          <div class="startup-msg-fb">Iniciando catálogo digital...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
